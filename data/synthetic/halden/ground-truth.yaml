    kind: potential_conflict
    topic: Directory Sync availability
    records: ["ticket:HAL-4821#c3", doc:scim-ga-decision]
    notes: >-
      What Support told Acme (October, 14 Aug) vs the product decision (GA 8 Dec, 18 Sep).
      No supersession metadata; both are true statements of different things (what the
      customer was told, what the plan is). Lattice must attribute both and not resolve.
  - id: scim-date-kickoff-vs-decision
    kind: potential_conflict
    topic: Directory Sync availability
    records: ["doc:acme-kickoff-call-notes#3", doc:scim-ga-decision]
    notes: The June "Q3" statement vs the September decision.
  - id: scim-roadmap-vs-decision
    kind: potential_conflict
    topic: Directory Sync GA date
    records: [doc:roadmap-2026-h2, doc:scim-ga-decision]
    notes: >-
      The decision record mentions the roadmap's September date "for context" but carries
      no supersession metadata and does not claim to replace the roadmap.
  - id: scim-decision-vs-speculation
    kind: potential_conflict
    topic: Directory Sync GA date
    records: [doc:scim-ga-decision, "chat:C0SALES0001:day:2026-09-25"]
    notes: Newer, lower-authority Slack speculation (early November) vs the approved decision (8 Dec).
  - id: kestrel-incident-window
    kind: potential_conflict
    topic: Duration of the 21 July SSO incident
    records: [doc:kestrel-sso-incident-customer-rca, doc:postmortem-inc-2026-031]
    notes: Customer RCA says 07:40-09:55 (web); the postmortem says 07:38-10:15 including mobile.
  - id: audit-streaming-timing
    kind: potential_conflict
    topic: Audit log streaming availability
    records: ["ticket:HAL-4750#c2", doc:release-notes-2026-09]
    notes: "Support said Q4 (3 Aug); release notes say beta available (15 Sep)."
  - id: refund-window-project-plan
    kind: potential_conflict
    topic: Enterprise refund window
    records: [doc:billing-migration-project-plan, doc:refund-policy-v2]
    notes: >-
      The 2025 project plan quotes 30 days. It is not linked to v2 by metadata (only v1
      is), so relative to v2 this is a potential conflict plus staleness, not supersession.
  - id: refund-v2-supersedes-v1
    kind: superseded
    topic: Enterprise refund window
    records: [doc:refund-policy-v2, doc:refund-policy-v1]
    notes: "v2 front matter: supersedes: refund-policy-v1."
  - id: sla-2026-supersedes-2025
