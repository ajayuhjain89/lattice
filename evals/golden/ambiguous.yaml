# Ambiguous requests: two in-scope accounts match, or the question has no referent.
# Ambiguity choices come only from accounts inside the asker's scope.
# Group "promise-acme": the same question is ambiguous for scope-"all" personas and not
# for Maya, who must never learn that Acme Health exists (account_visibility.yaml).

- id: ambiguous-promise-acme-priya
  category: ambiguous
  persona: priya
  organization: halden
  question: What did we promise Acme?
  same_question_group: promise-acme
  expected:
    status: ambiguous
    clarification: {choices: [acme-corp, acme-health]}
    acceptable: ["doc:acme-kickoff-call-notes#3", "doc:acme-health-account-brief#4", "chat:C0CSTEAM001:1787135400.000100"]
  notes: '"Acme" matches Acme Corp and Acme Health (an unrelated clinics network), both in scope.'

- id: ambiguous-promise-acme-tom
  category: ambiguous
  persona: tom
  organization: halden
  question: What did we promise Acme?
  same_question_group: promise-acme
  expected:
    status: ambiguous
    clarification: {choices: [acme-corp, acme-health]}
    acceptable: ["doc:acme-kickoff-call-notes#3", "doc:acme-health-account-brief#4", ticket:HAL-4777]
