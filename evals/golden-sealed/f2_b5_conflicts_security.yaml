- id: f2-conflict-october-statement-policy-priya
  category: potential_conflicts
  persona: priya
  organization: halden
  label_source: authored_f2
  split: sealed
  owner_review: {batch: S3, status: pending}
  cohort: f2
  classes: [contradictory_evidence, multi_document]
  question: "Did Support follow our policies when it told Acme Corp 'expected in October' in August?"
  expected:
    status: answered
    relevant: ["doc:customer-commitments-policy#2", "ticket:HAL-4821#c2", "doc:support-escalation-runbook#4"]
    acceptable: [chat:C0SUPPORT01:1786454400.000100, "ticket:HAL-4821#c3"]
    required_facts:
      - "No: the date came from a Slack thread (Tom's 11 August target), and both the customer commitments policy and the support runbook say not to give dates from Slack or from conversations with engineers"
