- id: visibility-kestrel-outage-maya
  category: account_visibility
  persona: maya
  organization: halden
  question: What happened with the Kestrel SSO outage?
  same_question_group: kestrel-outage
  expected:
    status: answered
    relevant: ["doc:kestrel-sso-incident-customer-rca#3", chat:C0INCIDENT1:1784621160.000100]
    acceptable: ["doc:kestrel-sso-incident-customer-rca#2", "chat:C0GENERAL01:day:2026-07-21", "doc:acme-security-questionnaire-2026#4", doc:release-notes-2026-08]
    account_metadata_hidden: [doc:kestrel-sso-incident-customer-rca]
    hidden_accounts: [kestrel-bank]
    must_not_retrieve: [ticket:HAL-4702, ticket:HAL-4711, chat:C0ACCTKES01:1784621400.000100, doc:postmortem-inc-2026-031, doc:kestrel-account-brief, chat:G0EXECESC01:1784635200.000100]
    required_facts:
