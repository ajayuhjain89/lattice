      - {date: 2025-02-11, record: "ticket:HAL-3187#c2", what: "Support tells Acme: P1 within 1 hour"}
      - {date: 2026-01-12, record: doc:support-sla-policy-2026, what: "2026 policy supersedes 2025: P1 30 minutes"}

