  same_question_group: acme-commitments
  expected:
    status: answered
    relevant: ["doc:acme-kickoff-call-notes#3", "ticket:HAL-4821#c3", "doc:scim-ga-decision#2", chat:G0ACCTACME1:1790244300.000100]
    acceptable: [doc:acme-account-brief, doc:acme-q3-success-plan, chat:G0ACCTACME1:1781284800.000100, doc:acme-renewal-plan-2026, doc:acme-qbr-2026-03, "doc:acme-security-questionnaire-2026#3", chat:G0ACCTACME1:1786723800.000100, chat:G0ACCTACME1:1789983000.000100]
