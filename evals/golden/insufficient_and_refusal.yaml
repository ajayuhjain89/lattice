# --- P13.2 additions (label_source authored_phase13; provisional until owner review) ---
# Insufficient evidence near a relevant topic: the account, product or document exists
# and is readable, the asked-for fact does not (checked against every readable record).

- id: partial-eu-region-month-tom
  category: insufficient_evidence
  persona: tom
  organization: halden
  label_source: authored_phase13
  split: held_out
  owner_review: {batch: H1, status: pending}
  classes: [insufficient_evidence, paraphrase]
  paraphrase_group: eu-data-region
  question: In which month of 2027 will the Frankfurt region go live?
  expected:
    status: partial
    relevant: ["doc:eu-data-residency-decision#2", "doc:eu-data-residency-decision#5"]
    acceptable: ["doc:engineering-all-hands-2026-09#3", "chat:C0ANNOUNC01:day:2026-08-05", "chat:C0SUPPORT01:day:2026-08-06"]
    required_facts:
      - "Only the quarter is known: general availability is planned for Q1 2027"
      - "The decision record says not to commit a month"
    forbidden_claims: ["The Frankfurt region launches in January 2027"]
  notes: >-
    The month is genuinely absent. The all-hands' "first internal workspace in
    November" is about the build-out, not general availability.

