- id: f2-acct-acme-tilburg-maya
  category: lookup
  persona: maya
  organization: halden
  label_source: authored_f2
  split: dev
  cohort: f2
  classes: [scoped_retrieval]
  question: "What is the Tilburg rollout, and how does it figure in Acme Corp's renewal?"
  scope: {account: acme-corp}
  expected:
    status: answered
    relevant: ["doc:acme-renewal-plan-2026#2", "doc:acme-renewal-plan-2026#5"]
    required_facts:
      - "250 more seats for Acme's Tilburg plant rollout in Q1, part of the renewal ask"
      - "Tilburg rollout services at no charge (Marcus estimates 3 days) are a lever"
  exhaustive: true
  exhaustive_review:
    reviewed_on: 2026-10-29
    reviewer: engineering
    terms: [Tilburg]
    candidates:
      "doc:acme-renewal-plan-2026#2": relevant
      "doc:acme-renewal-plan-2026#5": relevant
    notes: >-
      Two renewal-plan sections name Tilburg; both answer part of the question.
  notes: >-
    Only the renewal plan mentions Tilburg, and only Maya, Grace and Arjun can read it.

