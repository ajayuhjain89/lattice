# Straightforward lookups, including exact identifiers (docs/evaluation-plan.md §4).
# Record keys: doc:<id>[#part], ticket:<id>[#cN], chat:<channel>:<ts|day:date>; another
# organization's record is prefixed with "<org>/".

- id: lookup-hal-4821-priority
  category: lookup
  persona: priya
  organization: halden
  question: "What's the priority of HAL-4821?"
  expected:
    status: answered
    relevant: [ticket:HAL-4821]
    must_not_retrieve: [veridian/ticket:HAL-4821, veridian/doc:acme-account-plan]
    required_facts: ["HAL-4821 is high priority", "It is still open"]
  tags: [exact_identifier, security, cross_org_same_identifier]
  trap_phrases: [HAL-4821]
  notes: >-
    The exact-identifier path must match Halden's ticket only. Veridian has a ticket with
    the same ID (normal priority, pending) and a document naming it.

