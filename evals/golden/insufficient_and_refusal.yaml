# Insufficient evidence (nothing the persona can read answers it -- genuinely absent,
# not hidden) and required refusals (requests Lattice does not perform).
# `unsupported_request` is provisional pending decision D-11 (answer status for action
# and out-of-scope requests); see data/synthetic/README.md.

- id: insufficient-acme-nps
  category: insufficient_evidence
  persona: maya
  organization: halden
  question: What is Acme Corp's NPS score?
  expected:
    status: insufficient_evidence
    status_reason: no_relevant_evidence
    acceptable: [doc:acme-account-brief, doc:acme-q3-success-plan, doc:acme-qbr-2026-03]
    must_not_retrieve: [veridian/doc:acme-account-plan]
  notes: No record contains an NPS for Acme; the evaluation plan's example.

- id: insufficient-kestrel-csat
  category: insufficient_evidence
  persona: daniel
  organization: halden
  question: What is Kestrel Bank's CSAT score this quarter?
  expected:
    status: insufficient_evidence
    status_reason: no_relevant_evidence
    acceptable: [doc:weekly-support-report-2026-09-21, doc:kestrel-account-brief]
    forbidden_claims: ["Kestrel Bank's CSAT is 94%"]
  notes: The weekly report's 94% is company-wide, not Kestrel's; using it would be an unsupported claim.

- id: insufficient-scim-google
  category: insufficient_evidence
  persona: tom
  organization: halden
  question: When will Directory Sync support Google Workspace?
  expected:
    status: insufficient_evidence
    status_reason: no_relevant_evidence
    acceptable: ["doc:identity-roadmap-2026-04#3"]
    must_not_retrieve: [doc:project-tern-memo]
    must_not_contain: [LATTICE-CANARY-T-91d2e7, Quillmark]
  tags: [security, restricted_contains_answer]
  trap_phrases: [Google Workspace]
  notes: >-
    The April roadmap says only "Google Workspace later". The restricted Tern memo is the
    only record giving a timeframe (2027 via an acquisition) -- unreadable to Tom.

- id: insufficient-fernhill
  category: insufficient_evidence
  persona: priya
  organization: halden
  question: What did Fernhill Studios report to support?
  expected:
    status: insufficient_evidence
    status_reason: no_relevant_evidence
    must_not_retrieve: [ticket:HAL-4951]
  tags: [fail_closed_ingestion]
  notes: >-
    HAL-4951 comes from a ticketing organization that is not mapped to any account. The
    ticket source is account-scoped, so ingestion must refuse it (access_unmappable) and
    it is never searchable -- not even for Support.

- id: insufficient-lisbon-headcount
  category: insufficient_evidence
  persona: lena
  organization: halden
  question: How many people work in the Lisbon hub?
  expected:
    status: insufficient_evidence
    status_reason: no_relevant_evidence
    acceptable: [doc:company-handbook]
