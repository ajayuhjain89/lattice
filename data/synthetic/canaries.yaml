# Security canaries: unique strings placed in deliberately sensitive records. The
# security suites (Phase 5–6) fail if a canary appears in any candidate list, context,
# provider payload, response, trace or log of a persona who cannot read its record.
#
# The dataset lint verifies that each string occurs exactly once across all raw
# sources, exactly in the declared record part, that no undeclared canary exists, and
# that it guards something: an `access` canary sits in a record at least one persona of
# its own organization cannot read; an `isolation` canary is readable inside its
# organization and exists to catch cross-organization leaks.
# IDs are neutral on purpose: they never describe what they protect. `protects` names
# the access mechanism under test, for maintainers.
canaries:
  # --- Halden: confidential + department restriction --------------------------------
  - id: B
    string: LATTICE-CANARY-B-7f3a9c
    organization: halden
    record: doc:acme-exec-escalation-notes#4
    protects: confidential, Leadership-only, account Acme Corp (authorization-model §10)
