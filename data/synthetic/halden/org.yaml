# Halden — the design customer (docs/product-brief.md, docs/evaluation-plan.md §2).
# Lattice-side configuration: organization, departments, accounts, the eight persona
# memberships and admin-defined access groups. Seeded by `lattice seed`.
# Source content and source-synced groups (private Slack channels) are raw source data
# under documents/, tickets/ and slack/, ingested in Phase 4; see ../README.md.
# Emails use the reserved .example domain.

organization:
  slug: halden
  name: Halden
  # Generated data: may reach a development-only provider (ADR-010).
  data_origin: synthetic

departments:
  - {key: sales, name: Sales}
  - {key: customer-success, name: Customer Success}
  - {key: support, name: Support}
  - {key: product, name: Product}
  - {key: engineering, name: Engineering}
  - {key: leadership, name: Leadership}
  - {key: it, name: IT}

accounts:
  - {key: acme-corp, name: Acme Corp, aliases: [Acme, ACME Corp]}
  - {key: northpeak-logistics, name: Northpeak Logistics, aliases: [Northpeak]}
  - {key: brightwater-health, name: Brightwater Health, aliases: [Brightwater]}
  - {key: kestrel-bank, name: Kestrel Bank, aliases: [Kestrel]}
  # Name collision with Acme Corp, for ambiguity handling.
  - {key: acme-health, name: Acme Health, aliases: [Acme]}
  - {key: larkspur-retail, name: Larkspur Retail, aliases: [Larkspur]}
  - {key: tidewell-energy, name: Tidewell Energy, aliases: [Tidewell]}
  - {key: orbital-freight, name: Orbital Freight, aliases: [Orbital], status: prospect}

members:
  - email: maya.okafor@halden.example
    display_name: Maya Okafor
    role_label: Account Manager
    clearance: internal
    account_scope: assigned
    departments: [sales]
    accounts: [acme-corp, northpeak-logistics]

  - email: daniel.reyes@halden.example
    display_name: Daniel Reyes
    role_label: Account Manager
    clearance: internal
    account_scope: assigned
    departments: [sales]
    accounts: [brightwater-health, kestrel-bank]

  - email: priya.natarajan@halden.example
    display_name: Priya Natarajan
    role_label: Support Engineer
    clearance: internal
    account_scope: all
    departments: [support]

  - email: tom.lindqvist@halden.example
    display_name: Tom Lindqvist
    role_label: Product Manager
    clearance: internal
    account_scope: all
    departments: [product]

  - email: sofia.marchetti@halden.example
    display_name: Sofia Marchetti
    role_label: Engineering Lead
    clearance: internal
    account_scope: all
    departments: [engineering]

  - email: grace.whitfield@halden.example
    display_name: Grace Whitfield
    role_label: VP Customer Success
    clearance: confidential
    account_scope: all
    departments: [leadership, customer-success]

  - email: arjun.mehta@halden.example
    display_name: Arjun Mehta
    role_label: CEO
    clearance: confidential
    account_scope: all
    departments: [leadership]

  # Administrator: manages Lattice; being an admin grants no content access (SEC-15).
  - email: lena.brandt@halden.example
    display_name: Lena Brandt
    role_label: IT Administrator
    is_admin: true
    clearance: internal
    account_scope: assigned
    departments: [it]

# Admin-defined access groups, identified by their stable key (D-9). Documents grant
# to them by key (front matter `grants: [group:<key>]`). Private Slack channels are
# source-synced groups defined by the export (slack/groups.json), not here.
groups:
  - key: exec-staff
    name: Exec staff
    members: [grace.whitfield@halden.example, arjun.mehta@halden.example]
