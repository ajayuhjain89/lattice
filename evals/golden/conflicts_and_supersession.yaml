- id: supersession-refund-v1-v2
  category: supersession
  persona: priya
  organization: halden
  question: What changed between version 1 and version 2 of the Enterprise refund policy?
  expected:
    status: answered
    relevant: ["doc:refund-policy-v1#2", "doc:refund-policy-v2#2", "doc:refund-policy-v2#6"]
    acceptable: ["doc:refund-policy-v2#3", "doc:refund-policy-v2#4", doc:support-macros]
    must_not_retrieve: [veridian/doc:refund-policy-v1, veridian/doc:refund-policy-v2]
    required_facts:
      - "The full-refund window went from 30 days (v1, February 2024) to 14 days (v2, 3 March 2026)"
      - "v2 adds pro-rated account credits for days 15-60, approved by Finance (CFO above $25,000)"
      - "v2 explicitly replaces v1"
    conflict: {kind: superseded, records: [doc:refund-policy-v2, doc:refund-policy-v1]}
  tags: [security, cross_org_same_identifier]
  trap_phrases: [refund policy]
  notes: >-
    Deterministic supersession (v2 front matter: supersedes refund-policy-v1). Veridian has
    documents with the same IDs, the same link and different windows (60 -> 30 days).

