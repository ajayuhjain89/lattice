- id: xdoc-kestrel-open-sso-tickets
  category: cross_document
  persona: daniel
  organization: halden
  question: Summarize Kestrel Bank's open SSO tickets.
  expected:
    status: answered
    relevant: [ticket:HAL-4889, ticket:HAL-4902]
    acceptable: [ticket:HAL-4930, ticket:HAL-4702, ticket:HAL-4711, chat:C0ACCTKES01:1788526800.000100]
    must_not_retrieve: [veridian/ticket:HAL-4889]
    required_facts:
      - "HAL-4889: intermittent 'assertion expired' errors; Halden's logs point to one PingFederate node about 4 minutes behind; open"
      - "HAL-4902: request for IdP-initiated login in the mobile app; logged as a feature request; open"
    freshness: {stale: false}
  tags: [cross_org_same_identifier]
  notes: >-
    Only authored tickets are open (bulk distractors are all solved or closed), so the
    open set is exact. Veridian's HAL-4889 is a solved SSO ticket at another tenant.

