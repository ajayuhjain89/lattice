      - {date: 2026-02-24, record: doc:northpeak-expansion-proposal, what: "Expansion proposal; decision expected in April"}
      - {date: 2026-03-16, record: "ticket:HAL-4347#c3", what: "Webhook retry fix"}
      - {date: 2026-03-18, record: doc:northpeak-account-brief, what: "Last brief update"}
      - {date: 2026-03-20, record: "chat:C0ACCTNPK01:day:2026-03-20", what: "Lars on leave; decision waits (last evidence)"}
      - {date: 2026-09-21, record: doc:renewal-risk-register-2026-q3, what: "Leadership notes no contact since March"}

  - id: audit-log-streaming
    title: Audit log streaming — "Q4" becomes a September beta
    exercises: [stale, potential_conflict, cross_source]
    current_state: "Beta available since 2026.09 (15 Sep); GA planned for 2026.11. Brightwater's ticket still says Q4."
    events:
      - {date: 2026-06-10, record: doc:audit-log-streaming-prd, what: "PRD targets Q4 2026"}
      - {date: 2026-08-03, record: "ticket:HAL-4750#c2", what: "Support tells Brightwater: Q4"}
      - {date: 2026-09-15, record: doc:release-notes-2026-09, what: "Streaming ships in beta"}
      - {date: 2026-09-21, record: "chat:C0ACCTBRW01:day:2026-09-21", what: "Daniel tells Karen the beta is available"}

  - id: acme-name-collision
