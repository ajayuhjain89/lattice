# Phase 13 follow-ups F2, batch 1 (label_source authored_f2; no split until
# `lattice dataset splits --propose`): single-record lookups over records no item
# targeted before, abstention probes, action requests and the Acme alias.
# Record keys: doc:<id>[#part], ticket:<id>[#cN], chat:<channel>:<ts|day:date>; another
# organization's record is prefixed with "<org>/".

- id: f2-lookup-handbook-pto-lena
  category: lookup
  persona: lena
  organization: halden
  label_source: authored_f2
  cohort: f2
  question: "How many days of paid time off do Halden employees get?"
  expected:
    status: answered
    relevant: ["doc:company-handbook#4"]
    must_not_retrieve: [veridian/doc:company-handbook]
    required_facts:
      - "25 days of paid time off plus local public holidays"
  tags: [security, cross_org_same_identifier]
  trap_phrases: ["paid time off"]
  notes: >-
    Veridian's handbook has the same document ID and says 28 days: another tenant's
    policy that must not answer a Halden employee.

