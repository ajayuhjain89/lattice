  same_question_group: scim-ga-date
  expected:
    status: answered
    relevant: ["doc:scim-ga-decision#2", "chat:C0SALES0001:day:2026-09-25"]
    acceptable: [chat:C0ANNOUNC01:1789741800.000100, doc:scim-beta-program-plan, doc:roadmap-2026-h2, chat:C0SALES0001:1789741920.000100, "ticket:HAL-4821#c3", doc:release-notes-2026-09]
    must_not_retrieve: [doc:project-tern-memo, chat:G0PRODIDEN1:1790265600.000100]
    required_facts:
      - "The approved decision record (18 September) targets GA for 8 December 2026 (release 2026.12)"
      - "A newer Slack message (25 September, Marcus Feld) speculates about early November; it is unverified"
    conflict: {kind: potential_conflict, records: [doc:scim-ga-decision, "chat:C0SALES0001:day:2026-09-25"]}
