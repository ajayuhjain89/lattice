# Halden — the design customer (docs/product-brief.md, docs/evaluation-plan.md §2).
# Phase 1 scope: organization, departments, accounts, people and memberships only.
# Access groups (private channels, "Exec staff") and all content arrive in Phases 2–3.
# Emails use the reserved .example domain.

organization:
  slug: halden
  name: Halden

departments:
  - {key: sales, name: Sales}
  - {key: customer-success, name: Customer Success}
  - {key: support, name: Support}
  - {key: product, name: Product}
  - {key: engineering, name: Engineering}
  - {key: leadership, name: Leadership}
  - {key: it, name: IT}

accounts:
  - {key: acme-corp, name: Acme Corp, aliases: [Acme, ACME Corp]}
  - {key: northpeak-logistics, name: Northpeak Logistics, aliases: [Northpeak]}
  - {key: brightwater-health, name: Brightwater Health, aliases: [Brightwater]}
  - {key: kestrel-bank, name: Kestrel Bank, aliases: [Kestrel]}
  # Name collision with Acme Corp, for ambiguity handling.
  - {key: acme-health, name: Acme Health, aliases: [Acme]}
  - {key: larkspur-retail, name: Larkspur Retail, aliases: [Larkspur]}
  - {key: tidewell-energy, name: Tidewell Energy, aliases: [Tidewell]}
  - {key: orbital-freight, name: Orbital Freight, aliases: [Orbital], status: prospect}

members:
