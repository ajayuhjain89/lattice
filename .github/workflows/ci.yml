name: CI

on:
  push:
  pull_request:
  # Publish the images of a commit whose push CI already passed (e.g. a Phase 11 revision
  # for future staging) without merging it: the `images` job checks that run instead of
  # repeating the test jobs, which are skipped on dispatch (D-27).
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this revision is published (recorded in the run)"
        required: true

permissions:
  contents: read

# Pinned deliberately (docs/runbook.md §7): the runner image, uv and every action's
# major version change only in a reviewed commit. `ubuntu-latest` moves to Ubuntu 26
# in October 2026; setup-uv publishes no floating major tags.

jobs:
  backend:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: ci-superuser-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      # Throwaway credentials for the ephemeral CI database only.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-superuser-password
      LATTICE_ENV: test
      LATTICE_DATABASE_URL: postgresql+asyncpg://lattice_app:ci-app-password@localhost:5432/lattice
      LATTICE_MIGRATION_DATABASE_URL: postgresql+asyncpg://lattice_owner:ci-owner-password@localhost:5432/lattice
      LATTICE_TEST_DATABASE_URL: postgresql+asyncpg://lattice_app:ci-app-password@localhost:5432/lattice_test
      LATTICE_TEST_MIGRATION_DATABASE_URL: postgresql+asyncpg://lattice_owner:ci-owner-password@localhost:5432/lattice_test
      LATTICE_TEST_SUPERUSER_DATABASE_URL: postgresql+asyncpg://postgres:ci-superuser-password@localhost:5432/lattice_test
      LATTICE_TEST_WORKER_DATABASE_URL: postgresql+asyncpg://lattice_worker:ci-worker-password@localhost:5432/lattice_test
      LATTICE_WORKER_DATABASE_URL: postgresql+asyncpg://lattice_worker:ci-worker-password@localhost:5432/lattice
      # Property-based SQL <-> reference policy proof: the plan's CI minimum.
      LATTICE_AUTHZ_EXAMPLES: "500"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: Install dependencies (locked, with the local-inference runtime; no model weights)
        run: uv sync --locked --extra local

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Dataset lint (synthetic data + golden set; no database, no model)
        run: uv run lattice dataset lint

      - name: Production bootstrap as a non-superuser platform administrator (Phase 11)
        # The managed-PostgreSQL path creates the roles and the `lattice` database with
        # CREATEROLE + CREATEDB only. template1's vector stands in for a platform's
        # extension allow-list (pgvector is not a trusted extension).
        working-directory: .
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres \
            -c "CREATE ROLE ci_platform_admin LOGIN CREATEROLE CREATEDB PASSWORD 'ci-admin-password'"
          psql -v ON_ERROR_STOP=1 -d template1 -c "CREATE EXTENSION IF NOT EXISTS vector"
          PGUSER=ci_platform_admin PGPASSWORD=ci-admin-password psql -v ON_ERROR_STOP=1 -d postgres \
            -v owner_password=ci-owner-password -v app_password=ci-app-password \
            -v worker_password=ci-worker-password -f infra/postgres/bootstrap_production.sql

      - name: Bootstrap the test database (superuser bootstrap; idempotent over the above)
        working-directory: .
        run: >-
          psql -v ON_ERROR_STOP=1 -d postgres
          -v owner_password=ci-owner-password -v app_password=ci-app-password
          -v worker_password=ci-worker-password -f infra/postgres/bootstrap.sql

      - name: Migrations apply to a clean database (lattice migrate), round-trip, and match the models
        run: |
          uv run lattice migrate
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Seed and verify the runtime role
        run: |
          uv run lattice seed --manifest ../data/synthetic/halden/org.yaml --manifest ../data/synthetic/veridian/org.yaml
          uv run lattice seed --manifest ../data/synthetic/halden/org.yaml --manifest ../data/synthetic/veridian/org.yaml
          uv run lattice check-db-role
          # The worker's startup checks (role, schema revision) with an empty queue.
          uv run lattice worker --once

      - name: Sync the dataset twice (fake embeddings); the second sync writes nothing
        shell: bash
        run: |
          # Exit 3 = partial: Halden's HAL-4951 is unmapped on purpose. Anything else fails.
          sync() {
            for org in halden veridian; do
              uv run lattice sync --org "$org" --sources "../data/synthetic/$org/sources.yaml" \
                --embedding fake || [ $? -eq 3 ] || return 1
            done
          }
          sync
          sync | tee second-sync.txt
          if grep -E '(create|update|access|deleted) [1-9]' second-sync.txt; then
            echo "the second sync wrote something"; exit 1
          fi
          for org in halden veridian; do
            uv run lattice apply-admin-grants --org "$org" \
              --grants "../data/synthetic/$org/admin-grants.yaml"
          done

      - name: The production migration is a no-op on the seeded data; deployment checks pass
        run: |
          uv run lattice migrate
          uv run lattice check-deployment

      - name: Retrieval evaluation as every persona (security metrics must be 0)
        # Fake embeddings: this gates security, not quality (docs/evaluation-plan.md §9).
        run: uv run lattice eval retrieval --embedding fake --quiet

      - name: Answer evaluation as every persona (fake generation; security metrics must be 0)
        # Fake providers: this gates security and plumbing, not answer quality
        # (docs/evaluation-plan.md §13). No external credential is ever used in CI.
        run: uv run lattice eval answer --generation fake --embedding fake --quiet

      - name: Tests (real PostgreSQL)
        run: uv run pytest

  # Known vulnerabilities in the locked dependency sets (Phase 10). Separate job: it
  # needs the advisory databases, and a new advisory must not hide test results.
  dependency-audit:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-suffix: audit

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit the backend and web dependencies
        run: make audit

  web:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          # Its own cache: this job installs a smaller set than the backend job.
          cache-suffix: web

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile

      - name: The generated API contract matches the backend
        # The OpenAPI schema is exported from the FastAPI app (no database) and the
        # TypeScript types regenerated; any difference means one side changed alone.
        run: |
          (cd ../../backend && uv sync --locked --no-dev && uv run --no-sync python scripts/export_openapi.py ../apps/web/src/api/openapi.json)
          pnpm api:types
          git diff --exit-code -- src/api/openapi.json src/api/schema.gen.ts

      - name: Lint (ESLint incl. jsx-a11y, Stylelint)
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests (flows, accessibility, responsive shell; API mocked from typed fixtures)
        run: pnpm exec playwright test --project=desktop --project=mobile --project=production
        env:
          CI: "true"

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Images (D-27): only for pushes to main, v* tags and manual dispatch -- never for a
  # development branch push. On a push it runs after the three jobs above passed in the
  # SAME run (nothing is re-tested); on dispatch it requires an earlier successful push
  # run of this exact commit. Builds both images, starts the reference stack from them
  # and smokes it (container-level checks the test jobs cannot make), then publishes to
  # GHCR with GITHUB_TOKEN (no long-lived credential) and records the digests.
  images:
    needs: [backend, web, dependency-audit]
    if: >-
      always() && !cancelled() && (
        github.event_name == 'workflow_dispatch' || (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
          needs.backend.result == 'success' && needs.web.result == 'success' &&
          needs.dependency-audit.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
    concurrency:
      group: images-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - name: A dispatched publication needs a green push run of this exact commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason }}
        run: |
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success" --jq '.total_count')
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::no successful push CI run for ${GITHUB_SHA}: push it and let CI pass first"
            exit 1
          fi
          echo "Publishing ${GITHUB_SHA} from ${GITHUB_REF_NAME}: ${REASON}" >> "$GITHUB_STEP_SUMMARY"

      - name: Image names and version
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version=unknown
          case "$GITHUB_REF" in refs/tags/v*) version="${GITHUB_REF_NAME}" ;; esac
          {
            echo "backend=ghcr.io/${owner}/lattice-backend"
            echo "web=ghcr.io/${owner}/lattice-web"
            echo "version=${version}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build the backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          load: true
          tags: ${{ steps.names.outputs.backend }}:sha-${{ github.sha }}
          build-args: |
            LATTICE_BUILD_REVISION=${{ github.sha }}
            LATTICE_BUILD_VERSION=${{ steps.names.outputs.version }}
          labels: org.opencontainers.image.created=${{ steps.names.outputs.created }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          file: apps/web/Dockerfile
          load: true
          tags: ${{ steps.names.outputs.web }}:sha-${{ github.sha }}
          build-args: |
            LATTICE_BUILD_REVISION=${{ github.sha }}
            LATTICE_BUILD_VERSION=${{ steps.names.outputs.version }}
          labels: org.opencontainers.image.created=${{ steps.names.outputs.created }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Reference stack from these images, then smoke (production settings)
        env:
          LATTICE_BACKEND_IMAGE: ${{ steps.names.outputs.backend }}:sha-${{ github.sha }}
          LATTICE_WEB_IMAGE: ${{ steps.names.outputs.web }}:sha-${{ github.sha }}
        run: |
          make prod-env
          make prod-up
          make prod-smoke
          make prod-check

      - name: Stop the reference stack
        if: always()
        run: make prod-destroy || true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish by digest (sha-<commit>, plus the release tag on v*)
        env:
          BACKEND: ${{ steps.names.outputs.backend }}
          WEB: ${{ steps.names.outputs.web }}
          VERSION: ${{ steps.names.outputs.version }}
        run: |
          {
            echo "| Image | Tags | Digest |"
            echo "| ----- | ---- | ------ |"
          } >> "$GITHUB_STEP_SUMMARY"
          for image in "$BACKEND" "$WEB"; do
            tags="sha-${GITHUB_SHA}"
            if [ "$VERSION" != unknown ]; then
              docker tag "${image}:sha-${GITHUB_SHA}" "${image}:${VERSION}"
              tags="${tags} ${VERSION}"
            fi
            for tag in $tags; do docker push --quiet "${image}:${tag}"; done
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "${image}:sha-${GITHUB_SHA}")
            echo "| ${image} | ${tags} | \`${digest#*@}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
