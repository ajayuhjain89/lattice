# organization's record is prefixed with "<org>/".

- id: f2-lookup-okta-leaver-lena
  category: lookup
  persona: lena
  organization: halden
  label_source: authored_f2
  split: sealed
  owner_review: {batch: S1, status: pending}
  cohort: f2
  question: "How quickly is a leaver's Okta account deactivated after HR deactivates them in BambooHR?"
  expected:
    status: answered
    relevant: ["doc:okta-admin-procedures#3"]
    required_facts:
      - "Within 15 minutes, and the user is signed out of every app"
  exhaustive: true
  exhaustive_review:
    reviewed_on: 2026-10-29
    reviewer: engineering
    terms: [BambooHR]
    candidates:
      "doc:okta-admin-procedures#2": unrelated
      "doc:okta-admin-procedures#3": relevant
    notes: >-
      Both procedure sections that name BambooHR; the joiners section does not answer a
      question about leavers.
  notes: >-
    IT-only procedures for Halden's own Okta tenant (not customer IdPs).

- id: f2-lookup-audit-streaming-latency-sofia
  category: lookup
  persona: sofia
  organization: halden
  label_source: authored_f2
  split: sealed
  owner_review: {batch: S1, status: pending}
  cohort: f2
  question: "What delivery latency is audit log streaming supposed to achieve?"
  expected:
    status: answered
    relevant: ["doc:audit-log-streaming-prd#3"]
    acceptable: ["doc:release-notes-2026-09#2"]
    required_facts:
      - "Under 60 seconds at p95, with at-least-once delivery and event IDs for de-duplication"
  exhaustive: true
  exhaustive_review:
    reviewed_on: 2026-10-29
    reviewer: engineering
    terms: ["60 seconds"]
    candidates:
      "doc:audit-log-streaming-prd#3": relevant
      "doc:release-notes-2026-09#2": acceptable
      "ticket:HAL-3278#c1": unrelated
      "ticket:HAL-3505#c1": unrelated
    extra: ["doc:release-notes-2026-09#2"]
    notes: >-
      The PRD scope states the target; the 2026.09 release notes say 'within about a
      minute' without the term, so they are added by hand.
  notes: >-
    The PRD is the requirement; release notes describe the beta.

