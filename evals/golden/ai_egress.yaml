# Authorized but not egressed: Leadership can read confidential/restricted evidence, but
# under the default AI egress policy (internal only) it never reaches the model provider.
# It is returned as "Not used to draft this answer" (not_used_for_answer). Under
# opt_in_confidential, confidential evidence may be sent; restricted never is.
# Group "acme-commitments": the permanent critical scenario (authorization-model §10).

- id: egress-acme-commitments-grace
  category: ai_egress
  persona: grace
  organization: halden
  label_source: authored_phase3
  split: held_out
  owner_review: {batch: H3, status: pending}
  classes: [multi_document, contradictory_evidence, egress_withheld, scoped_retrieval]
  paraphrase_group: acme-scim-promises
  question: What commitments have we made to Acme?
  same_question_group: acme-commitments
  scope: {account: acme-corp}
  expected_by_egress:
    default:
      status: answered
      relevant: ["doc:acme-kickoff-call-notes#3", "ticket:HAL-4821#c3", "doc:scim-ga-decision#2", chat:G0ACCTACME1:1790244300.000100]
      not_used_for_answer: [doc:acme-exec-escalation-notes, chat:G0EXECESC01:1790101200.000100]
      acceptable: [doc:acme-account-brief, doc:acme-q3-success-plan, chat:G0ACCTACME1:1781284800.000100, doc:acme-renewal-plan-2026, doc:renewal-risk-register-2026-q3, doc:pricing-packaging-2027-draft]
      must_not_retrieve: [veridian/doc:acme-exec-escalation-notes, veridian/doc:acme-account-plan]
      required_facts:
        - "SCIM planned for Q3 and included in the Enterprise plan (June kickoff)"
        - "Support: expected in October (HAL-4821)"
        - "Decision record: beta from 9 November, GA 8 December"
        - "Two confidential sources were not sent to the AI model (egress notice)"
      must_not_contain: [LATTICE-CANARY-V2-c7e0a4]
      conflict: {kind: potential_conflict, records: ["ticket:HAL-4821#c3", doc:scim-ga-decision]}
    opt_in_confidential:
      status: answered
      relevant: ["doc:acme-kickoff-call-notes#3", "ticket:HAL-4821#c3", "doc:scim-ga-decision#2", "doc:acme-exec-escalation-notes#3", chat:G0EXECESC01:1790101200.000100]
      acceptable: [doc:acme-account-brief, doc:acme-q3-success-plan, chat:G0ACCTACME1:1790244300.000100, doc:acme-renewal-plan-2026, doc:renewal-risk-register-2026-q3, doc:pricing-packaging-2027-draft]
      must_not_retrieve: [veridian/doc:acme-exec-escalation-notes, veridian/doc:acme-account-plan]
      required_facts:
        - "Beta from 9 November with Kofi Mensah as dedicated engineer"
        - "GA targeted for 8 December"
        - "A service credit of two months' fees if GA is not delivered by 31 January 2027"
        - "Renewal price held flat for FY27 (7% uplift waived)"
      conflict: {kind: potential_conflict, records: ["ticket:HAL-4821#c3", doc:scim-ga-decision]}
  tags: [critical_scenario, security, cross_org_same_identifier]
  notes: >-
    Grace has scope "all", so "Acme" alone would be ambiguous (Acme Corp / Acme Health);
    the scenario runs with the Acme Corp scope selected. Veridian's document with the
    same ID and title must never appear, for any egress setting.

