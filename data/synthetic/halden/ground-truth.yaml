      Incident resolved 21 Jul (web 09:55, mobile 10:15 UTC); dual-signing shipped in
      2026.08. Kestrel's HAL-4889 ("assertion expired", one skewed IdP node) and HAL-4902
      (mobile IdP-initiated login) are open. Leadership rates the January renewal high
      risk and has authorised up to 8% (confidential).
    events:
      - {date: 2026-07-21, record: "ticket:HAL-4702#c1", what: "Kestrel P1: nobody can sign in"}
      - {date: 2026-07-21, record: "chat:C0INCIDENT1:1784621160.000100", what: "Incident INC-2026-031 in #incidents"}
      - {date: 2026-07-21, record: "chat:C0ACCTKES01:1784621400.000100", what: "Account channel follows the outage"}
      - {date: 2026-07-21, record: "chat:G0EXECESC01:1784635200.000100", what: "Exec escalation: offer the contractual credit only"}
      - {date: 2026-07-28, record: doc:kestrel-sso-incident-customer-rca, what: "Customer RCA: 07:40-09:55 UTC"}
      - {date: 2026-07-30, record: doc:postmortem-inc-2026-031, what: "Internal postmortem: 07:38-10:15 UTC including mobile"}
      - {date: 2026-08-18, record: doc:release-notes-2026-08, what: "Dual-signing with 30-day overlap ships"}
      - {date: 2026-09-04, record: "ticket:HAL-4889#c1", what: "New 'assertion expired' errors"}
      - {date: 2026-09-11, record: "chat:C0ACCTKES01:1789143600.000100", what: "Kestrel's risk committee wants a vendor review"}
      - {date: 2026-09-16, record: doc:kestrel-renewal-risk-2026, what: "Leadership: renewal high risk, up to 8% approved"}

  - id: kestrel-rca-grant
    title: An explicit grant outside account scope (decision D-8)
    exercises: [explicit_grant_outside_account_scope, account_visibility]
    current_state: >-
      Maya holds an admin grant on the Kestrel customer RCA (to answer Acme's
      questionnaire follow-up). She can read the document, including its text naming
