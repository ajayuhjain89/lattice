# What Halden's synthetic data is designed to contain. Engineers only: this states
# ground truth no product user would see. Every reference is checked by
# `lattice dataset lint` (existence, dates, order, supersession metadata, markers).
# Record references: doc:<id>[#part], ticket:<id>[#cN], chat:<channel>:<ts|day:date>[#ts].
organization: halden

storylines:
  - id: acme-scim-commitment
    title: What was Acme Corp told about Directory Sync (SCIM), by whom, and what is true now
    exercises: [customer_commitment, product_timeline_conflict, cross_source, stale, restricted, account_scope, egress]
    current_state: >-
      As of 27 Sep 2026 the approved plan is GA in the 2026.12 release (target 8 Dec 2026)
      with an Acme beta from 9 Nov (decision record, 18 Sep). The customer-facing ticket
      HAL-4821 still says "expected in October"; Derek asked on 23 Sep whether October
      stands, and Acme procurement wants the date in writing (HAL-4944). Confidential
      executive commitments from 22 Sep (a credit if GA slips past 31 Jan 2027, a flat
      renewal) are readable by Leadership only. A 25 Sep Slack message speculates about
      an early-November GA; it is unverified and lower authority.
    events:
      - {date: 2026-03-24, record: doc:acme-qbr-2026-03, what: "Acme asks for SCIM; Maya says it is on the H2 roadmap, no date"}
      - {date: 2026-04-08, record: doc:identity-roadmap-2026-04, what: "Product plans Directory Sync for Q3 2026"}
      - {date: 2026-06-12, record: "doc:acme-kickoff-call-notes#3", what: "Maya tells Acme SCIM is planned for Q3 and included in their Enterprise plan"}
      - {date: 2026-06-12, record: "chat:G0ACCTACME1:1781284800.000100", what: "Maya reports the Q3 statement to the account team"}
      - {date: 2026-07-02, record: doc:roadmap-2026-h2, what: "H2 roadmap lists GA in September (2026.09)"}
      - {date: 2026-08-10, record: "chat:G0PRODIDEN1:1786352400.000100", what: "Identity squad: September is not happening, October realistic"}
      - {date: 2026-08-11, record: "chat:C0SUPPORT01:1786454400.000100", what: "Tom tells Support October is a target, not a commitment"}
      - {date: 2026-08-12, record: "ticket:HAL-4810#c2", what: "Support tells Brightwater Health: expected in October"}
      - {date: 2026-08-14, record: "ticket:HAL-4821#c3", what: "Support tells Acme: expected in October"}
      - {date: 2026-09-03, record: "chat:G0PRODIDEN1:1788430500.000100", what: "Load tests fail; October is off; rewrite needed"}
      - {date: 2026-09-08, record: doc:directory-sync-rewrite-rfc, what: "RFC for the rewrite; explicitly supersedes the v1 design"}
      - {date: 2026-09-18, record: doc:scim-ga-decision, what: "Decision: GA 8 Dec 2026, Acme beta from 9 Nov"}
      - {date: 2026-09-21, record: "ticket:HAL-4821#c5", what: "Support holds the customer update; no dates on the ticket"}
      - {date: 2026-09-22, record: doc:acme-exec-escalation-notes, what: "Executive call: confidential commitments to Acme"}
      - {date: 2026-09-23, record: "ticket:HAL-4821#c6", what: "Derek asks whether October is still the plan"}
      - {date: 2026-09-24, record: "chat:G0ACCTACME1:1790244300.000100", what: "Grace: confirm only decision-record dates, nothing contractual"}
      - {date: 2026-09-25, record: "chat:C0SALES0001:day:2026-09-25", what: "Unverified speculation: GA could be early November"}

  - id: refund-policy
    title: Enterprise refund window, v1 to v2, and a customer told the old rule
    exercises: [explicit_supersession, stale, authority]
    current_state: >-
      Refund policy v2 (3 Mar 2026, explicitly supersedes v1): full refund within 14
      days; days 15-60 pro-rated credit approved by Finance. A 2025 project plan still
      quotes v1's 30 days. Support quoted 30 days to Larkspur on 19 May 2026 and
      corrected it the next day.
    events:
      - {date: 2024-02-01, record: doc:refund-policy-v1, what: "v1: full refund within 30 days"}
      - {date: 2025-06-09, record: doc:billing-migration-project-plan, what: "Project plan quotes the 30-day window"}
      - {date: 2026-03-03, record: doc:refund-policy-v2, what: "v2 supersedes v1: 14 days, then credits"}
      - {date: 2026-05-19, record: "ticket:HAL-4533#c2", what: "Support tells Larkspur the old 30-day rule"}
      - {date: 2026-05-20, record: "ticket:HAL-4533#c3", what: "Team lead corrects it internally, citing v2"}
      - {date: 2026-05-20, record: "ticket:HAL-4533#c4", what: "Public correction to the customer"}
      - {date: 2026-05-28, record: "ticket:HAL-4533#c6", what: "Three-month credit agreed with Finance"}

  - id: support-sla
    title: Enterprise first-response targets, 2025 to 2026
    exercises: [explicit_supersession, stale]
    current_state: "SLA policy 2026 (supersedes 2025): Enterprise P1 first response 30 minutes, P2 2 hours."
    events:
