      - {date: 2026-08-28, record: "doc:acme-security-questionnaire-2026#4", what: "Acme's questionnaire asks about incidents"}
      - {date: 2026-09-16, record: "doc:lattice-pilot-access-log#3", what: "IT logs the document-level grant to Maya"}

