# Phase 13 follow-ups F2, batch 2 (label_source authored_f2; no split until
# `lattice dataset splits --propose`): synthesis questions whose answer needs three or
# more records, the stratum Phase 13 could not move.
# Record keys: doc:<id>[#part], ticket:<id>[#cN], chat:<channel>:<ts|day:date>; another
# organization's record is prefixed with "<org>/".

- id: f2-xdoc-acme-identity-history-grace
  category: cross_source
  persona: grace
  organization: halden
  label_source: authored_f2
  cohort: f2
  classes: [multi_document]
  question: "Summarize Acme Corp's identity setup with us from go-live to today."
  expected:
    status: answered
    relevant: ["doc:acme-onboarding-plan-2024#3", "doc:acme-qbr-2026-03#4", "doc:acme-kickoff-call-notes#2", chat:C0EXTACME01:1785607200.000100, "ticket:HAL-4821#c1"]
    acceptable: ["doc:acme-account-brief#4", "doc:acme-account-brief#6", ticket:HAL-4612, chat:G0ACCTACME1:day:2026-07-10, "doc:acme-q3-success-plan#2"]
    must_not_retrieve: [veridian/doc:acme-account-plan]
    required_facts:
      - "Go-live in December 2024 on Azure AD SAML, with users created just in time and leavers deactivated by hand"
      - "Acme moved Halden SSO to Okta on 1 August 2026"
      - "After the cutover, Okta deactivations did not remove Halden access (HAL-4821), which made automated deprovisioning (SCIM) the open ask"
  tags: [security, cross_org_same_name]
  trap_phrases: ["Acme Corp"]
  notes: >-
    Five records across two years; Veridian's plan for the same company is another
    tenant's.

